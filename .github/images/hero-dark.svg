<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="Nivakaran Shanmugabavan. I build software that thinks.">
  <defs>
    <clipPath id="card"><rect width="1280" height="400" rx="28"/></clipPath>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70"/></filter>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4DA3FF"/><stop offset="0.5" stop-color="#BF7BFF"/><stop offset="1" stop-color="#FF6B9D"/></linearGradient>
  </defs>
  <g clip-path="url(#card)">
