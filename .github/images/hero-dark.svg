    <text x="640" y="304" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#A1A1A6">Software engineer and AI builder in Colombo, Sri Lanka</text>
