    <g filter="url(#soft)"><circle cx="130" cy="60" r="170" fill="#0A84FF" opacity="0.38"/><circle cx="1180" cy="360" r="190" fill="#FF2D55" opacity="0.28"/><circle cx="1120" cy="40" r="140" fill="#AF52DE" opacity="0.3"/></g>
    <text x="640" y="172" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="68" font-weight="700" letter-spacing="-1.5" fill="#F5F5F7">Nivakaran Shanmugabavan</text>
