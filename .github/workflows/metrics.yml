name: generate-metrics

# Builds two self-hosted SVG dashboards into assets/ so the profile never
# depends on a rate-limited third-party render service.
#
# REQUIRED SECRET: METRICS_TOKEN
#   Settings -> Developer settings -> Personal access tokens -> Tokens (classic)
#   Scopes: public_repo  (add read:user if you want private-contribution counts)
#   Then: repo Settings -> Secrets and variables -> Actions -> New secret

on:
  schedule:
    # 03:15 UTC daily == 08:45 Asia/Colombo
    - cron: "15 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: metrics
  cancel-in-progress: true

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Main dashboard
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: assets/metrics.svg
          user: ${{ github.repository_owner }}
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Colombo
          config_display: large
          config_animations: yes
          committer_message: "chore(ci): refresh metrics dashboard"

          plugin_languages: yes
          plugin_languages_details: percentage, bytes-size
          plugin_languages_limit: 8
          plugin_languages_threshold: 1%
          plugin_languages_sections: most-used
          plugin_languages_indepth: no

          plugin_lines: yes
          plugin_lines_sections: base
          plugin_lines_repositories_limit: 4

          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          plugin_achievements: yes
          plugin_achievements_threshold: B
          plugin_achievements_secrets: yes
          plugin_achievements_display: compact
          plugin_achievements_limit: 0

      - name: Habits panel
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: assets/metrics-habits.svg
          user: ${{ github.repository_owner }}
          template: classic
          base: ""
          config_timezone: Asia/Colombo
          committer_message: "chore(ci): refresh habits panel"

          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_trim: yes
